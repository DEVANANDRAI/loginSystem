<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body{
            background:#f5f7fb;
        }

        .sidebar{
            width:250px;
            height:100vh;
            position:fixed;
            background:#212529;
        }

        .sidebar a{
            color:white;
            text-decoration:none;
            display:block;
            padding:15px 20px;
            transition:.3s;
        }

        .sidebar a:hover{
            background:#0d6efd;
        }

        .content{
            margin-left:250px;
        }

        .card{
            border:none;
            border-radius:12px;
        }
    </style>
</head>
<body>

<!-- Sidebar -->

<div class="sidebar">

    <h3 class="text-center text-white py-4">
        Dashboard
    </h3>

    <a href="#">
        <i class="bi bi-house-door"></i>
        Home
    </a>

    <a href="#">
        <i class="bi bi-person"></i>
        Profile
    </a>

    <a href="#">
        <i class="bi bi-gear"></i>
        Settings
    </a>

    <a href="{% url 'logout' %}">
        <i class="bi bi-box-arrow-right"></i>
        Logout
    </a>

</div>


<div class="content">

    <!-- Navbar -->

    <nav class="navbar navbar-light bg-white shadow-sm">

        <div class="container-fluid">

            <h4 class="mb-0">
                Welcome, {{ request.session.name }}
            </h4>

            <a href="{% url 'logout' %}" class="btn btn-danger">
                Logout
            </a>

        </div>

    </nav>


    <div class="container py-4">

        <div class="row g-4">

            <div class="col-md-4">
                <div class="card shadow p-4">
                    <h5>Total Users</h5>
                    <h2>125</h2>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow p-4">
                    <h5>Projects</h5>
                    <h2>18</h2>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow p-4">
                    <h5>Messages</h5>
                    <h2>42</h2>
                </div>
            </div>

        </div>


        <div class="card shadow mt-5">

            <div class="card-header bg-primary text-white">
                User Information
            </div>

            <div class="card-body">

                <table class="table">

                    <tr>
                        <th>Name</th>
                        <td>{{ request.session.name }}</td>
                    </tr>

                    <tr>
                        <th>Email</th>
                        <td>{{ request.session.email }}</td>
                    </tr>

                    <tr>
                        <th>Status</th>
                        <td>
                            <span class="badge bg-success">
                                Logged In
                            </span>
                        </td>
                    </tr>

                </table>

            </div>

        </div>

    </div>

</div>

</body>
</html>
