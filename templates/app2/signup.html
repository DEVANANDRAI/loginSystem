<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body{
            background:linear-gradient(135deg,#0d6efd,#6f42c1);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:30px 0;
        }

        .signup-card{
            width:100%;
            max-width:650px;
            border:none;
            border-radius:15px;
            overflow:hidden;
        }

        .signup-header{
            background:#0d6efd;
            color:white;
            text-align:center;
            padding:25px;
        }

        .form-control,
        .form-select{
            height:48px;
        }

        .btn-register{
            height:48px;
            font-size:18px;
        }

        a{
            text-decoration:none;
        }
    </style>
</head>
<body>

<div class="card shadow-lg signup-card">

    <div class="signup-header">
        <i class="bi bi-person-plus-fill display-4"></i>
        <h3 class="mt-2">Create Account for Student</h3>
        <p class="mb-0">Join us today!</p>
    </div>

    <div class="card-body p-4">

        <form method="POST" action="{% url 'signup' %}">
            {% csrf_token %}

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-control" placeholder="Enter your name" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Mobile Number</label>
                    <input type="text" name="mobile" class="form-control" placeholder="Enter mobile number" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="Enter email" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Date of Birth</label>
                    <input type="date" name="dob" class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Gender</label>
                    <select class="form-select" name="gender" required>
                        <option selected disabled>Select Gender</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">City</label>
                    <input type="text" name="city" class="form-control" placeholder="Enter city">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Create password" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-control" placeholder="Confirm password" required>
                </div>

            </div>

            <div class="form-check mb-3">
                <input class="form-check-input" name="caccept" value="True" type="checkbox" required>
                <label class="form-check-label">
                    I agree to the Terms & Conditions
                </label>
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-register">
                <i class="bi bi-person-plus"></i>
                Create Account
            </button>

        </form>

        <hr>

        <p class="text-center mb-0">
            Already have an account?
            <a href="{% url 'signin' %}">
                Sign In
            </a>
        </p>

    </div>

</div>

</body>
</html>
